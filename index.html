<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <meta name="description" content="Dapur Pintar — Asisten dapur cerdas berbasis AI. Kelola stok kulkas, rekomendasi masakan, dan cegah food waste.">
  <meta name="theme-color" content="#00652c">
  <title>Dapur Pintar</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Plus Jakarta Sans + Material Symbols -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "tertiary-fixed-dim": "#ffb77d",
            "on-error": "#ffffff",
            "background": "#f9f9ff",
            "inverse-primary": "#79db8d",
            "error": "#ba1a1a",
            "surface-container-lowest": "#ffffff",
            "on-background": "#111c2d",
            "on-secondary-container": "#571a00",
            "on-tertiary-fixed-variant": "#6e3900",
            "surface-container-low": "#f0f3ff",
            "on-tertiary-fixed": "#2f1500",
            "on-secondary-fixed": "#370e00",
            "surface-variant": "#d8e3fb",
            "secondary-fixed": "#ffdbce",
            "on-tertiary-container": "#fff1e9",
            "on-primary-fixed": "#00210a",
            "secondary-container": "#fd651e",
            "surface-tint": "#006d30",
            "on-tertiary": "#ffffff",
            "on-primary": "#ffffff",
            "tertiary-fixed": "#ffdcc3",
            "outline": "#6f7a6e",
            "inverse-surface": "#263143",
            "surface-container-highest": "#d8e3fb",
            "primary-container": "#15803d",
            "on-primary-fixed-variant": "#005323",
            "secondary": "#a73a00",
            "surface-container-high": "#dee8ff",
            "surface-dim": "#cfdaf2",
            "on-primary-container": "#d3ffd5",
            "error-container": "#ffdad6",
            "on-secondary": "#ffffff",
            "surface": "#f9f9ff",
            "on-surface": "#111c2d",
            "primary-fixed": "#95f8a7",
            "on-error-container": "#93000a",
            "primary-fixed-dim": "#79db8d",
            "outline-variant": "#becabc",
            "tertiary": "#854600",
            "surface-bright": "#f9f9ff",
            "tertiary-container": "#a95b00",
            "inverse-on-surface": "#ecf1ff",
            "on-secondary-fixed-variant": "#7f2b00",
            "primary": "#00652c",
            "surface-container": "#e7eeff",
            "on-surface-variant": "#3f493f",
            "secondary-fixed-dim": "#ffb599"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          spacing: {
            "gutter": "1rem",
            "margin-sm": "1rem",
            "gutter-sm": "0.75rem",
            "space-xl": "2rem",
            "space-sm": "0.5rem",
            "gutter-lg": "1.5rem",
            "space-md": "1rem",
            "margin": "1.25rem",
            "space-xs": "0.25rem",
            "margin-lg": "2rem",
            "space-lg": "1.5rem"
          },
          fontFamily: {
            "headline-md": ["Plus Jakarta Sans"],
            "label-lg": ["Plus Jakarta Sans"],
            "headline-lg": ["Plus Jakarta Sans"],
            "body-md": ["Plus Jakarta Sans"],
            "headline-xl-mobile": ["Plus Jakarta Sans"],
            "headline-xl": ["Plus Jakarta Sans"],
            "headline-lg-mobile": ["Plus Jakarta Sans"],
            "label-sm": ["Plus Jakarta Sans"],
            "body-lg": ["Plus Jakarta Sans"],
            "label-md": ["Plus Jakarta Sans"],
            "headline-sm": ["Plus Jakarta Sans"],
            "body-sm": ["Plus Jakarta Sans"]
          },
          fontSize: {
            "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
            "label-lg": ["15px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
            "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "body-md": ["14px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "400" }],
            "headline-xl-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
            "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.025em", "fontWeight": "800" }],
            "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "700" }],
            "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "700" }],
            "body-lg": ["16px", { "lineHeight": "26px", "letterSpacing": "0em", "fontWeight": "400" }],
            "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.015em", "fontWeight": "600" }],
            "headline-sm": ["17px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "600" }],
            "body-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "400" }]
          }
        }
      }
    };
  </script>

  <style>
    @layer base {
      html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
      main > :first-child { margin-top: 0 !important; }
      main > :last-child { margin-bottom: 0 !important; }
    }
    ::-webkit-scrollbar { display: none; }

    /* Page transition */
    .page-enter {
      animation: pageIn 0.25s ease-out;
    }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Skeleton loading */
    .skeleton {
      background: linear-gradient(90deg, #e7eeff 25%, #dee8ff 50%, #e7eeff 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Hide material symbols until loaded */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen">

  <!-- App Header -->
  <header id="app-header" class="fixed top-0 inset-x-0 z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe">
  </header>

  <!-- App Main Content -->
  <main id="app-main" class="flex-1 flex flex-col relative w-full pt-16 pb-24 bg-surface overflow-y-auto">
  </main>

  <!-- Bottom Tab Navigation -->
  <nav id="app-nav" class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(30,41,59,0.05)]">
    <div class="flex justify-around items-center h-16 px-gutter-sm max-w-md mx-auto">
      <a class="flex flex-col items-center justify-center flex-1 h-full py-1 text-primary font-bold transition-colors" data-path="beranda" href="#beranda">
        <span class="material-symbols-outlined text-[24px]">cottage</span>
        <span class="font-label-sm text-label-sm mt-0.5">Beranda</span>
      </a>
      <a class="flex flex-col items-center justify-center flex-1 h-full py-1 text-on-surface-variant hover:text-primary transition-colors" data-path="pindai" href="#pindai">
        <span class="material-symbols-outlined text-[24px]">document_scanner</span>
        <span class="font-label-sm text-label-sm mt-0.5">Pindai</span>
      </a>
      <a class="flex flex-col items-center justify-center flex-1 h-full py-1 text-on-surface-variant hover:text-primary transition-colors" data-path="ide-masak" href="#ide-masak">
        <span class="material-symbols-outlined text-[24px]">skillet</span>
        <span class="font-label-sm text-label-sm mt-0.5">Ide Masak</span>
      </a>
      <a class="flex flex-col items-center justify-center flex-1 h-full py-1 text-on-surface-variant hover:text-primary transition-colors" data-path="catatan" href="#catatan">
        <span class="material-symbols-outlined text-[24px]">menu_book</span>
        <span class="font-label-sm text-label-sm mt-0.5">Catatan</span>
      </a>
    </div>
  </nav>

  <!-- Toast Notification Overlay -->
  <div id="app-toast" class="fixed top-20 inset-x-4 z-[60] max-w-sm mx-auto transform -translate-y-10 opacity-0 pointer-events-none transition-all duration-300">
  </div>

  <!-- Modal Overlay -->
  <div id="app-modal" class="fixed inset-0 z-[70] hidden">
  </div>

  <!-- API Key Onboarding Modal -->
  <div id="onboarding-modal" class="fixed inset-0 z-[80] bg-inverse-surface/60 backdrop-blur-sm flex flex-col justify-end hidden">
    <div class="bg-surface-container-lowest rounded-t-3xl p-6 flex flex-col gap-4 shadow-2xl max-w-lg mx-auto w-full">
      <div class="w-12 h-1.5 rounded-full bg-surface-container-highest mx-auto"></div>
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-primary flex items-center justify-center text-on-primary">
          <span class="material-symbols-outlined text-[28px]">kitchen</span>
        </div>
        <div>
          <h2 class="font-headline-md text-headline-md text-on-surface">Selamat Datang!</h2>
          <p class="font-body-sm text-body-sm text-on-surface-variant">Setup Dapur Pintar dalam 30 detik</p>
        </div>
      </div>

      <div class="space-y-3">
        <div>
          <label class="font-label-md text-label-md text-on-surface block mb-1.5" for="input-name">Nama Kamu</label>
          <input id="input-name" type="text" value="Sari" placeholder="Masukkan nama"
            class="w-full h-12 px-4 rounded-xl bg-surface-container border border-outline-variant text-on-surface font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
        </div>
        <div>
          <label class="font-label-md text-label-md text-on-surface block mb-1.5" for="input-api-key">
            API Key Gemini
            <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" class="text-primary font-normal ml-1 text-body-sm">(Dapatkan gratis →)</a>
          </label>
          <input id="input-api-key" type="password" placeholder="AIzaSy..."
            class="w-full h-12 px-4 rounded-xl bg-surface-container border border-outline-variant text-on-surface font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
          <p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Disimpan lokal di HP kamu. Tidak dikirim ke server manapun.</p>
        </div>
      </div>

      <button id="btn-start-app" type="button"
        class="w-full h-12 rounded-xl bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md active:scale-[0.98] transition-all mt-2">
        <span class="material-symbols-outlined text-[20px]">rocket_launch</span>
        <span>Mulai Dapur Pintar</span>
      </button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.log('SW registration error:', err);
        });
      });
    }
  </script>
</body>
</html>
